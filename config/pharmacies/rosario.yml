# Cobertura irregular: alguns medicamentos tarja-vermelha não aparecem no
# catálogo online (ex.: dipirona retorna 0 itens). A API responde normalmente;
# quando a Rosário não lista um item, ela simplesmente aparece vazia na busca.
# checkout: false — endpoint /checkout/cart/add retorna 404 nesta loja VTEX.
name: Rosário
slug: rosario
enabled: true
mode: api
checkout: false

search:
  url: "https://www.drogariarosario.com.br/api/catalog_system/pub/products/search/{query}?_from=0&_to=19"

fields:
  results: ""
  nome: "productName"
  fabricante: "brand"
  preco: "items[0].sellers[0].commertialOffer.Price"
  preco_original: "items[0].sellers[0].commertialOffer.ListPrice"
  url: "link"
  imagem: "items[0].images[0].imageUrl"
  sku_id: "items[0].itemId"
  disponivel: "items[0].sellers[0].commertialOffer.IsAvailable"
  vendedor_id: "items[0].sellers[0].sellerId"
  vendedor_nome: "items[0].sellers[0].sellerName"
  promocao: "items[0].sellers[0].commertialOffer.Teasers[0].<Name>k__BackingField"
